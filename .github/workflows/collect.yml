name: collect

on:
  schedule:
    # twice a day, off-peak minutes (UTC); the page shows a trailing-week window
    - cron: "40 5 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect snapshot
        run: node scripts/collect.mjs
        env:
          OVERTAKE_ISSUE_FILE: ${{ runner.temp }}/overtake-issue.md
          DECLINE_ISSUE_FILE: ${{ runner.temp }}/decline-issue.md
          DIGEST_ISSUE_FILE: ${{ runner.temp }}/digest-issue.md
          GH_API_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # optional: unlocks model history back to 2025

      - name: Commit data
        run: |
          git config user.name "token-history-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data badges charts feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: $(date -u +%F) snapshot"
            git push
          fi


      # The collector failed silently for two months: the run went red twice a
      # day and nobody was watching a red square. One open issue is louder, and
      # it is opened once — not on every scheduled run.
      - name: Open an issue when collection breaks
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_count=$(gh issue list --label collect-failure --state open --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "an open collect-failure issue already exists; not filing another"
            exit 0
          fi
          gh label create collect-failure --color b60205 \
            --description "the daily collector could not fetch rankings" 2>/dev/null || true
          gh issue create --label collect-failure \
            --title "collect is failing — the archive has stopped" \
            --body "The scheduled collector failed. Until it is fixed the archive stops growing and \
          \`agentburn drift\` degrades to \"world: no data\".

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most likely cause, from experience: OpenRouter moved the rankings endpoint again. Check \
          \`scripts/lib/endpoints.mjs\` — add the new URL as the first candidate. Reproduce locally with \
          \`node scripts/collect.mjs\`.

          Close this issue once a run goes green; it is filed only when none is open."

      - name: Overtake alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="${{ runner.temp }}/overtake-issue.md"
          if [ -s "$F" ]; then
            TITLE="$(head -n 1 "$F" | sed 's/^# //')"
            gh issue create --title "$TITLE" --body-file "$F" --label overtake || true
          fi

      - name: Decline alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="${{ runner.temp }}/decline-issue.md"
          if [ -s "$F" ]; then
            TITLE="$(head -n 1 "$F" | sed 's/^# //')"
            gh issue create --title "$TITLE" --body-file "$F" --label decline || true
          fi

      - name: Weekly digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="${{ runner.temp }}/digest-issue.md"
          if [ -s "$F" ]; then
            TITLE="$(head -n 1 "$F" | sed 's/^# //')"
            gh issue create --title "$TITLE" --body-file "$F" --label digest || true
          fi
